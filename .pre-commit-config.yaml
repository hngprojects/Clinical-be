default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.15.1
    hooks:
      - id: commitizen
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest-migrations
        name: pytest (migration integrity)
        entry: uv run pytest tests/test_migrations.py --maxfail=1 -q
        language: system
        pass_filenames: false
        stages: [pre-commit]
