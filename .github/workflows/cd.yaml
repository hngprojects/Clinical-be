name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [staging, main]

jobs:
  # ============================================
  # Deploy Staging (staging branch)
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'staging'
    steps:
      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/akinola/Clinical-be

            export PATH="$HOME/.local/bin:$PATH"
            git pull origin staging

            echo "Installing dependencies..."
            uv sync

            echo "Exporting environment variables..."
            export DATABASE_URL="${{ secrets.DATABASE_URL }}"
            export GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
            export GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
            export GOOGLE_REDIRECT_URI="${{ secrets.GOOGLE_REDIRECT_URI }}"
            export OTP_PEPPER="${{ secrets.OTP_PEPPER }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            export FRONTEND_URL="${{ secrets.FRONTEND_URL }}"
            export RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}"
            export RESENT_FROM_EMAIL="${{ secrets.RESEND_FROM_EMAIL }}"

            echo "Running migrations..."
            uv run alembic upgrade head

            pm2 start ecosystem.config.js --env staging
            pm2 start ecosystem.config.js --env staging --update-env
            pm2 save

  # ============================================
  # Deploy Production (main branch)
  # ============================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    environment: production
    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/akinola/Clinical-be
            export PATH="$HOME/.local/bin:$PATH"
            git pull origin main

            echo "Installing dependencies..."
            uv sync

            echo "Running migrations..."
            uv run alembic upgrade head
            export DATABASE_URL="${{ secrets.DATABASE_URL }}"
            export GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
            export GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
            export GOOGLE_REDIRECT_URI="${{ secrets.GOOGLE_REDIRECT_URI }}"
            export OTP_PEPPER="${{ secrets.OTP_PEPPER }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            export FRONTEND_URL="${{ secrets.FRONTEND_URL }}"
            export RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}"
            export RESENT_FROM_EMAIL="${{ secrets.RESEND_FROM_EMAIL }}"
            pm2 start ecosystem.config.js --env production
            pm2 start ecosystem.config.js --env production --update-env
            pm2 save
